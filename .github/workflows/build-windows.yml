name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      # Ship our own Chromium (full build, not headless-shell) so users need no Chrome installed.
      # Version matches the installed playwright-core; lands in resources/browsers via build.extraResources.
      - name: Download bundled Chromium
        run: node scripts/install-browser.js
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\browsers
      - name: List bundled browser
        shell: pwsh
        run: |
          Get-ChildItem browsers
          $exe = Get-ChildItem browsers -Recurse -Filter chrome.exe | Select-Object -First 1
          if (-not $exe) { throw "chrome.exe not found under browsers/" }
          "Bundled chrome.exe: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          "browsers folder total: $([math]::Round(((Get-ChildItem browsers -Recurse -File | Measure-Object Length -Sum).Sum)/1MB,1)) MB"
      # Optional: bake the Google OAuth client secret into the packaged config (repo secret OAUTH_CLIENT_SECRET).
      # Skip-safe: without the secret nothing is written and users paste it in Settings > Cloud instead.
      - name: Inject OAuth client secret (optional)
        run: node scripts/inject-oauth-secret.js
        env:
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      - name: Check bundled ffmpeg (ffmpeg-static)
        shell: pwsh
        run: |
          $ff = "node_modules/ffmpeg-static/ffmpeg.exe"
          if (-not (Test-Path $ff)) { throw "ffmpeg-static did not download ffmpeg.exe" }
          "ffmpeg.exe: $([math]::Round((Get-Item $ff).Length/1MB,1)) MB"
      - name: Build installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify chrome.exe is inside the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked/resources/browsers -Recurse -Filter chrome.exe | Select-Object -First 1
          if (-not $exe) { throw "Bundled chrome.exe missing from dist/win-unpacked/resources/browsers" }
          "Packaged: $($exe.FullName)"
          Get-ChildItem dist/win-unpacked/resources/browsers
          if (-not (Test-Path dist/win-unpacked/resources/ffmpeg/ffmpeg.exe)) { throw "ffmpeg.exe missing from resources/ffmpeg" }
          if (-not (Test-Path dist/win-unpacked/resources/config/cloud.default.json)) { throw "cloud.default.json missing from resources/config" }
          "OAuth secret bundled: $(Test-Path dist/win-unpacked/resources/config/cloud.secret.json)"
          Get-ChildItem dist/*.exe | ForEach-Object { "Installer: $($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }
      - uses: actions/upload-artifact@v4
        with:
          name: UploadPilot-Setup
          path: dist/*.exe
